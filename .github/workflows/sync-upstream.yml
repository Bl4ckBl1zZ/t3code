name: Sync upstream

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: true

jobs:
  sync:
    name: Merge upstream main
    runs-on: halifax-bl4ckbl1zz-t3code-db2e22d1
    timeout-minutes: 15
    steps:
      - name: Checkout fork
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Merge upstream
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/pingdotgg/t3code.git
          git fetch --no-tags upstream main

          before="$(git rev-parse HEAD)"
          if ! git merge --no-edit upstream/main; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            unresolved=()

            for path in "${conflicts[@]}"; do
              if [[ "$path" == .github/workflows/* ]]; then
                echo "Keeping fork-managed workflow: $path"
                git checkout --ours -- "$path"
                git add -- "$path"
              else
                unresolved+=("$path")
              fi
            done

            if (( ${#unresolved[@]} > 0 )); then
              printf 'Upstream/main has source conflicts requiring manual resolution: %s\n' \
                "${unresolved[*]}" >&2
              git merge --abort
              exit 1
            fi

            git commit --no-edit
          fi
          after="$(git rev-parse HEAD)"

          if [[ "$before" == "$after" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Fork is already current with upstream/main."
          else
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Merged upstream/main at $after."
          fi
