name: iOS TestFlight

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: true

jobs:
  build-and-submit:
    name: Build iOS app locally and submit to TestFlight
    runs-on: macos-latest-large
    timeout-minutes: 120
    environment:
      name: production
    env:
      # Resolve the EAS project when evaluating the dynamic app config locally;
      # the same values are set in the EAS "production" environment for remote builds.
      APP_VARIANT: production
      T3CODE_EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
      T3CODE_EXPO_OWNER: ${{ vars.EXPO_OWNER }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Expose pnpm
        run: |
          pnpm_version="$(node --print "require('./package.json').packageManager.split('@').pop()")"
          vp_pnpm_bin="$HOME/.vite-plus/package_manager/pnpm/$pnpm_version/pnpm/bin"
          echo "$vp_pnpm_bin" >> "$GITHUB_PATH"
          "$vp_pnpm_bin/pnpm" --version

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          # npm, not pnpm: this only installs eas-cli into the action's own
          # tool dir, and pnpm 11 hard-fails that install on dtrace-provider's
          # ignored build script (no allowBuilds config outside the repo).
          packager: npm

      - name: Install EAS local build worker
        # eas-cli spawns the local build worker through `npm exec`, which
        # evaluates apps/mobile/package.json and hard-fails on the
        # react-native-nitro-markdown override/dependency conflict (EOVERRIDE).
        # Preinstall the worker globally from $HOME and point eas-cli at the
        # binary directly so npm never runs inside the repo.
        run: |
          cd "$HOME"
          npm install -g eas-cli-local-build-plugin
          echo "EAS_LOCAL_BUILD_PLUGIN_PATH=$(command -v eas-cli-local-build-plugin)" >> "$GITHUB_ENV"

      - name: Materialize local iOS signing credentials
        working-directory: apps/mobile
        env:
          APPLE_DISTRIBUTION_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          APPLE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          APPLE_MAIN_PROFILE: ${{ secrets.APPLE_MAIN_APPSTORE_PROFILE_BASE64 }}
          APPLE_WIDGETS_PROFILE: ${{ secrets.APPLE_WIDGETS_APPSTORE_PROFILE_BASE64 }}
          APPLE_SHARING_PROFILE: ${{ secrets.APPLE_SHARING_APPSTORE_PROFILE_BASE64 }}
          APPLE_API_KEY_VALUE: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID_VALUE: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_VALUE: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          mkdir -p credentials
          printf '%s' "$APPLE_DISTRIBUTION_P12_BASE64" | base64 -d > credentials/distribution.p12
          printf '%s' "$APPLE_MAIN_PROFILE" | base64 -d > credentials/main.mobileprovision
          printf '%s' "$APPLE_WIDGETS_PROFILE" | base64 -d > credentials/widgets.mobileprovision
          printf '%s' "$APPLE_SHARING_PROFILE" | base64 -d > credentials/sharing.mobileprovision
          printf '%s' "$APPLE_API_KEY_VALUE" > credentials/asc-api-key.p8
          node --eval '
            const fs = require("fs");
            const certificate = {
              path: "credentials/distribution.p12",
              password: process.env.APPLE_DISTRIBUTION_P12_PASSWORD,
            };
            fs.writeFileSync(
              "credentials.json",
              JSON.stringify(
                {
                  ios: {
                    T3Code: {
                      provisioningProfilePath: "credentials/main.mobileprovision",
                      distributionCertificate: certificate,
                    },
                    ExpoWidgetsTarget: {
                      provisioningProfilePath: "credentials/widgets.mobileprovision",
                      distributionCertificate: certificate,
                    },
                    "expo-sharing-extension": {
                      provisioningProfilePath: "credentials/sharing.mobileprovision",
                      distributionCertificate: certificate,
                    },
                  },
                },
                null,
                2,
              ),
            );
            // eas submit only reads the ASC API key from the submit profile, so
            // inject the key reference into eas.json here instead of committing ids.
            const easJson = JSON.parse(fs.readFileSync("eas.json", "utf8"));
            easJson.submit.production.ios = {
              ...easJson.submit.production.ios,
              ascApiKeyPath: "./credentials/asc-api-key.p8",
              ascApiKeyId: process.env.APPLE_API_KEY_ID_VALUE,
              ascApiKeyIssuerId: process.env.APPLE_API_ISSUER_VALUE,
            };
            fs.writeFileSync("eas.json", JSON.stringify(easJson, null, 2));
          '

      - name: Sync extension build number
        # The widget and sharing extensions bake their CFBundleVersion from
        # T3CODE_IOS_BUILD_NUMBER at prebuild, while EAS injects its remote,
        # auto-incremented build number into the main app only. The local build
        # sandbox sees just the EAS environment (not this shell), so push the
        # upcoming number into the EAS production environment before building;
        # a mismatch fails the archive at signing validation.
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          current="$(eas build:version:get --platform ios --non-interactive | sed -n 's/.*buildNumber - //p')"
          next=$((current + 1))
          eas env:update production --variable-name T3CODE_IOS_BUILD_NUMBER --value "$next" --non-interactive
          echo "Synced T3CODE_IOS_BUILD_NUMBER to $next"

      - name: Build iOS app locally
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build \
            --platform ios \
            --profile production \
            --local \
            --non-interactive \
            --output build-production.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-production-ipa
          path: apps/mobile/build-production.ipa
          if-no-files-found: error

      - name: Submit to TestFlight
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas submit \
            --platform ios \
            --profile production \
            --path build-production.ipa \
            --non-interactive
