name: iOS TestFlight

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: true

jobs:
  build-and-upload:
    name: Build and upload iOS app
    runs-on: [self-hosted, macOS, ARM64, t3code-mac]
    timeout-minutes: 90
    environment:
      name: production
    env:
      DEVELOPER_DIR: /Applications/Xcode-beta.app/Contents/Developer
      APP_VARIANT: production
      EXPO_NO_GIT_STATUS: "1"
      NODE_OPTIONS: --max-old-space-size=8192
      T3CODE_CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
      T3CODE_CLERK_JWT_TEMPLATE: ${{ vars.CLERK_JWT_TEMPLATE }}
      T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ vars.CLERK_CLI_OAUTH_CLIENT_ID }}
      T3CODE_RELAY_URL: https://${{ vars.RELAY_DOMAIN }}
      T3CODE_IOS_BUNDLE_ID: com.t3code.dev
      T3CODE_IOS_APP_GROUP_ID: group.com.bl4ckbl1zz.t3code.dev
      T3CODE_IOS_APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      T3CODE_IOS_APNS_ENVIRONMENT: production
      T3CODE_IOS_ASSOCIATED_DOMAINS: "1"
      T3CODE_IOS_SHARING_EXTENSION: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: false
          run-install: true

      - id: credentials
        name: Configure App Store Connect authentication
        shell: bash
        env:
          APPLE_API_KEY_VALUE: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID_VALUE: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_VALUE: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_DISTRIBUTION_P12_BASE64_VALUE: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          APPLE_DISTRIBUTION_P12_PASSWORD_VALUE: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          APPLE_MAIN_PROFILE_VALUE: ${{ secrets.APPLE_MAIN_APPSTORE_PROFILE_BASE64 }}
          APPLE_WIDGETS_PROFILE_VALUE: ${{ secrets.APPLE_WIDGETS_APPSTORE_PROFILE_BASE64 }}
          APPLE_SHARING_PROFILE_VALUE: ${{ secrets.APPLE_SHARING_APPSTORE_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          required=(
            T3CODE_IOS_APPLE_TEAM_ID
            APPLE_API_KEY_VALUE
            APPLE_API_KEY_ID_VALUE
            APPLE_API_ISSUER_VALUE
            APPLE_DISTRIBUTION_P12_BASE64_VALUE
            APPLE_DISTRIBUTION_P12_PASSWORD_VALUE
            APPLE_MAIN_PROFILE_VALUE
            APPLE_WIDGETS_PROFILE_VALUE
            APPLE_SHARING_PROFILE_VALUE
          )
          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing TestFlight configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi

          key_dir="$RUNNER_TEMP/app-store-connect-keys"
          mkdir -p "$key_dir"
          key_path="$key_dir/AuthKey_${APPLE_API_KEY_ID_VALUE}.p8"
          printf '%s' "$APPLE_API_KEY_VALUE" > "$key_path"
          chmod 600 "$key_path"

          signing_keychain="$RUNNER_TEMP/t3code-signing.keychain-db"
          signing_keychain_password="$(openssl rand -base64 36)"
          security create-keychain -p "$signing_keychain_password" "$signing_keychain"
          security set-keychain-settings -lut 7200 "$signing_keychain"
          security unlock-keychain -p "$signing_keychain_password" "$signing_keychain"
          security list-keychains -d user -s \
            "$signing_keychain" \
            "$HOME/Library/Keychains/login.keychain-db"

          distribution_p12="$RUNNER_TEMP/apple-distribution.p12"
          printf '%s' "$APPLE_DISTRIBUTION_P12_BASE64_VALUE" |
            base64 --decode > "$distribution_p12"
          security import "$distribution_p12" \
            -k "$signing_keychain" \
            -P "$APPLE_DISTRIBUTION_P12_PASSWORD_VALUE" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$signing_keychain_password" \
            "$signing_keychain"

          profile_dir="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$profile_dir"
          install_profile() {
            local encoded="$1"
            local temporary="$RUNNER_TEMP/profile-$RANDOM.mobileprovision"
            printf '%s' "$encoded" | base64 --decode > "$temporary"
            local uuid
            uuid="$(security cms -D -i "$temporary" | plutil -extract UUID raw -)"
            local destination="$profile_dir/$uuid.mobileprovision"
            cp "$temporary" "$destination"
            printf '%s' "$destination"
          }
          main_profile="$(install_profile "$APPLE_MAIN_PROFILE_VALUE")"
          widgets_profile="$(install_profile "$APPLE_WIDGETS_PROFILE_VALUE")"
          sharing_profile="$(install_profile "$APPLE_SHARING_PROFILE_VALUE")"

          {
            printf 'APPLE_API_KEY_PATH=%s\n' "$key_path"
            printf 'APPLE_API_PRIVATE_KEYS_DIR=%s\n' "$key_dir"
            printf 'APPLE_API_KEY_ID=%s\n' "$APPLE_API_KEY_ID_VALUE"
            printf 'APPLE_API_ISSUER=%s\n' "$APPLE_API_ISSUER_VALUE"
            printf 'APPLE_SIGNING_KEYCHAIN=%s\n' "$signing_keychain"
            printf 'APPLE_MAIN_PROFILE_PATH=%s\n' "$main_profile"
            printf 'APPLE_WIDGETS_PROFILE_PATH=%s\n' "$widgets_profile"
            printf 'APPLE_SHARING_PROFILE_PATH=%s\n' "$sharing_profile"
          } >> "$GITHUB_ENV"

      - name: Generate native iOS project
        working-directory: apps/mobile
        run: vp exec expo prebuild --clean --platform ios

      - id: native
        name: Resolve Xcode workspace and scheme
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail
          workspace="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          if [[ -z "$workspace" ]]; then
            echo "Expo did not generate an Xcode workspace." >&2
            exit 1
          fi
          scheme="$(
            xcodebuild -workspace "$workspace" -list -json |
              /usr/bin/python3 -c 'import json, sys; workspace = json.load(sys.stdin)["workspace"]; name = workspace["name"]; schemes = workspace["schemes"]; print(name) if name in schemes else sys.exit(f"Expected app scheme {name!r}; available schemes: {schemes}")'
          )"
          if [[ -z "$scheme" ]]; then
            echo "Could not resolve the generated app scheme." >&2
            exit 1
          fi
          echo "workspace=$workspace" >> "$GITHUB_OUTPUT"
          echo "scheme=$scheme" >> "$GITHUB_OUTPUT"

      - name: Archive signed iOS app
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail
          archive_path="$RUNNER_TEMP/T3Code.xcarchive"
          xcodebuild \
            -workspace "${{ steps.native.outputs.workspace }}" \
            -scheme "${{ steps.native.outputs.scheme }}" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$archive_path" \
            -derivedDataPath "$RUNNER_TEMP/t3code-derived-data" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$APPLE_API_KEY_PATH" \
            -authenticationKeyID "$APPLE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_API_ISSUER" \
            DEVELOPMENT_TEAM="$T3CODE_IOS_APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            -quiet \
            archive

      - name: Export signed IPA
        shell: bash
        run: |
          set -euo pipefail
          export_options="$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Add :method string app-store-connect" "$export_options"
          /usr/libexec/PlistBuddy -c "Add :destination string export" "$export_options"
          /usr/libexec/PlistBuddy -c "Add :signingStyle string manual" "$export_options"
          /usr/libexec/PlistBuddy -c "Add :signingCertificate string Apple Distribution" "$export_options"
          /usr/libexec/PlistBuddy -c "Add :teamID string $T3CODE_IOS_APPLE_TEAM_ID" "$export_options"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles dict" "$export_options"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:com.t3code.dev string T3 Code App Store" "$export_options"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:com.t3code.dev.widgets string T3 Code Widgets App Store" "$export_options"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:com.t3code.dev.sharing string T3 Code Sharing App Store" "$export_options"
          /usr/libexec/PlistBuddy -c "Add :manageAppVersionAndBuildNumber bool false" "$export_options"
          /usr/libexec/PlistBuddy -c "Add :stripSwiftSymbols bool true" "$export_options"
          /usr/libexec/PlistBuddy -c "Add :uploadSymbols bool true" "$export_options"

          mkdir -p "$RUNNER_TEMP/t3code-testflight-export"
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/T3Code.xcarchive" \
            -exportPath "$RUNNER_TEMP/t3code-testflight-export" \
            -exportOptionsPlist "$export_options" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$APPLE_API_KEY_PATH" \
            -authenticationKeyID "$APPLE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_API_ISSUER" \
            -quiet

      - name: Validate and upload to TestFlight
        shell: bash
        run: |
          set -euo pipefail
          export API_PRIVATE_KEYS_DIR="$APPLE_API_PRIVATE_KEYS_DIR"
          ipa="$(find "$RUNNER_TEMP/t3code-testflight-export" -maxdepth 1 -name '*.ipa' -print -quit)"
          if [[ -z "$ipa" ]]; then
            echo "No IPA was exported." >&2
            exit 1
          fi
          xcrun altool \
            --validate-app \
            --type ios \
            --file "$ipa" \
            --api-key "$APPLE_API_KEY_ID" \
            --api-issuer "$APPLE_API_ISSUER"
          xcrun altool \
            --upload-app \
            --type ios \
            --file "$ipa" \
            --api-key "$APPLE_API_KEY_ID" \
            --api-issuer "$APPLE_API_ISSUER"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: t3-code-ios-${{ github.run_number }}
          path: ${{ runner.temp }}/t3code-testflight-export/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload Xcode logs after failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: t3-code-ios-logs-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/t3code-derived-data/Logs
            /tmp/T3Code*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove temporary signing keychain
        if: always()
        shell: bash
        run: |
          security list-keychains -d user -s "$HOME/Library/Keychains/login.keychain-db"
          if [[ -n "${APPLE_SIGNING_KEYCHAIN:-}" && -f "$APPLE_SIGNING_KEYCHAIN" ]]; then
            security delete-keychain "$APPLE_SIGNING_KEYCHAIN"
          fi
          for profile in \
            "${APPLE_MAIN_PROFILE_PATH:-}" \
            "${APPLE_WIDGETS_PROFILE_PATH:-}" \
            "${APPLE_SHARING_PROFILE_PATH:-}"; do
            if [[ -n "$profile" && -f "$profile" ]]; then
              rm "$profile"
            fi
          done
