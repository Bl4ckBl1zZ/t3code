name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: halifax-bl4ckbl1zz-t3code-db2e22d1
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Check formatting and lint
        run: vp check

      - name: Typecheck
        run: vpr typecheck

      - name: Test
        env:
          CI: "true"
        run: vp run test

      - name: Check resource monitor
        run: |
          cargo fmt --manifest-path native/resource-monitor/Cargo.toml -- --check
          cargo test --locked --manifest-path native/resource-monitor/Cargo.toml

      - name: Build desktop pipeline
        run: vp run build:desktop

      - name: Verify desktop bundle
        run: |
          test -f apps/desktop/dist-electron/preload.cjs
          test -f apps/server/dist/bin.mjs
          test -f apps/server/dist/client/index.html
          grep -nE "desktopBridge|getLocalEnvironmentBootstrap|PICK_FOLDER_CHANNEL|wsUrl" apps/desktop/dist-electron/preload.cjs
          grep -n "__clerk_internal_electron_passkeys" apps/desktop/dist-electron/preload.cjs

      - name: Exercise release-only workflow steps
        run: node scripts/release-smoke.ts
