name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: halifax-bl4ckbl1zz-t3code-db2e22d1
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Reject repository-owned PR assets
        run: |
          files="$(git ls-files .github/pr-assets)"
          if test -n "$files"; then
            printf 'PR evidence must be uploaded to GitHub, not committed:\n%s\n' "$files" >&2
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: false
          run-install: true

      - name: Prepare executable temp directory
        run: |
          ci_tmp="$RUNNER_TEMP/t3code-ci-tmp"
          mkdir -p "$ci_tmp"
          chmod 1777 "$ci_tmp"
          echo "TMPDIR=$ci_tmp" >> "$GITHUB_ENV"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Check formatting and lint
        run: vp check

      - name: Typecheck
        run: vpr typecheck

      - name: Prepare unprivileged test user
        run: |
          if ! id -u t3ci >/dev/null 2>&1; then
            useradd --create-home --shell /bin/bash t3ci
          fi
          chown -R t3ci:t3ci "$GITHUB_WORKSPACE"
          parent="$GITHUB_WORKSPACE"
          while [[ "$parent" != "/" ]]; do
            chmod o+x "$parent"
            parent="$(dirname "$parent")"
          done
          runuser --user t3ci -- test -x "$GITHUB_WORKSPACE/node_modules/.bin/vp"

      - name: Test
        env:
          CI: "true"
        run: |
          runuser --user t3ci -- env \
            CI="$CI" \
            PATH="$PATH" \
            TMPDIR="$TMPDIR" \
            "$GITHUB_WORKSPACE/node_modules/.bin/vp" run test

      - name: Check resource monitor
        run: |
          cargo fmt --manifest-path native/resource-monitor/Cargo.toml -- --check
          cargo test --locked --manifest-path native/resource-monitor/Cargo.toml

      - name: Check the generated Swift contract fixture is current
        # The SwiftUI client mirrors packages/contracts by hand, so nothing else
        # makes a contract change fail its build. This is that signal.
        run: node scripts/generate-swift-contract-fixtures.ts --check

      - name: Build desktop pipeline
        run: vp run build:desktop

      - name: Verify desktop bundle
        run: |
          test -f apps/desktop/dist-electron/preload.cjs
          test -f apps/server/dist/bin.mjs
          test -f apps/server/dist/client/index.html
          grep -nE "desktopBridge|getLocalEnvironmentBootstrap|PICK_FOLDER_CHANNEL|wsUrl" apps/desktop/dist-electron/preload.cjs
          grep -n "__clerk_internal_electron_passkeys" apps/desktop/dist-electron/preload.cjs

  swift-ios:
    name: Native iOS
    # The only macOS job in CI. It exists because the SwiftUI client's contracts
    # are hand-written mirrors: a schema change compiles fine and fails at
    # runtime, so the native suite is the check that catches it.
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run the native test suite
        # Picks an available iPhone from the newest installed runtime, so the
        # job is not pinned to a device model the image may drop.
        run: ./apps/swift-ios/Scripts/ci-test.sh

      # SwiftLint is deliberately not wired up yet: apps/swift-ios has no
      # config, and running --strict over the vendored upstream sources would
      # fail on style this fork has not adopted. Add it with a config once the
      # tree has settled.
