name: Fork release (macOS arm64, Windows arm64/x64)

# Publishes this repository's desktop builds as `fork-v<version>` GitHub
# Releases. Installed builds update from these releases: the packager writes
# `provider: github` for T3CODE_DESKTOP_UPDATE_REPOSITORY into app-update.yml,
# and electron-updater reads `latest-mac.yml` / `latest.yml` from the newest
# published release. The bundle ID, product name, and signing team must stay
# the same from release to release, or installed apps cannot take the update.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Optional X.Y.Z version. Must be greater than the newest fork-v* release."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: fork-release
  cancel-in-progress: true

jobs:
  # Versions continue from the newest published `fork-v*` tag (the old
  # workflow used 0.1.<run number>, last published as fork-v0.1.390).
  # electron-updater only offers a strictly greater version, so this reads
  # the tags instead of trusting a run counter that resets when a workflow
  # file is renamed. Failed runs publish no tag and their number is reused.
  version:
    name: Resolve fork release version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - id: release
        name: Resolve fork release version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tags="$(git ls-remote --tags --refs "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" 'refs/tags/fork-v*')"
          latest="$(
            sed -n 's#^.*refs/tags/fork-v\([0-9]*\.[0-9]*\.[0-9]*\)$#\1#p' <<<"$tags" |
              sort -V | tail -n 1
          )"
          # Floor for a repository without fork tags: the last fork build that
          # used run numbers published 0.1.390.
          latest="${latest:-0.1.390}"
          IFS=. read -r major minor patch <<<"$latest"

          version="${REQUESTED_VERSION:-${major}.${minor}.$((patch + 1))}"
          version="${version#v}"
          # Stable X.Y.Z only: a prerelease suffix sorts below its release in
          # semver but not in `sort -V`, and installed builds skip prereleases.
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version: $version (expected X.Y.Z)" >&2
            exit 1
          fi
          if [[ "$version" == "$latest" || "$(printf '%s\n' "$latest" "$version" | sort -V | tail -n 1)" != "$version" ]]; then
            echo "Release version $version must be greater than fork-v$latest." >&2
            exit 1
          fi

          echo "Newest published fork release: fork-v$latest; building $version."
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=fork-v$version" >> "$GITHUB_OUTPUT"

  # The platform-independent JS (server bundle, web client, Electron main) is
  # built once here and packaged by every platform job, as upstream's release
  # does. The relay and Clerk values are baked into this bundle.
  build_bundle:
    name: Build JS bundle
    needs: [version]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production
    env:
      T3CODE_CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
      T3CODE_CLERK_JWT_TEMPLATE: ${{ vars.CLERK_JWT_TEMPLATE }}
      T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ vars.CLERK_CLI_OAUTH_CLIENT_ID }}
      RELAY_DOMAIN: ${{ vars.RELAY_DOMAIN }}
      # Installed fork builds keep their Electron profile (Local Storage,
      # IndexedDB, Windows credential keys) in this folder under the app data
      # directory; upstream's packaged default is t3code-v2.
      T3CODE_DESKTOP_USER_DATA_DIR_NAME: t3code
      # `t3 update` and server-update offers follow this repository. It does
      # not publish the t3 CLI, so builds offer desktop app updates only.
      T3CODE_RELEASE_REPOSITORY: ${{ github.repository }}
      # Fork builds send no usage analytics to upstream's PostHog unless the
      # user sets T3CODE_TELEMETRY_ENABLED=true; this bakes in the default.
      T3CODE_TELEMETRY_ENABLED: "false"
    steps:
      - name: Require T3 Connect public config
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in T3CODE_CLERK_PUBLISHABLE_KEY T3CODE_CLERK_JWT_TEMPLATE T3CODE_CLERK_CLI_OAUTH_CLIENT_ID RELAY_DOMAIN; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "Missing production configuration: ${missing[*]}" >&2
            exit 1
          fi
          echo "T3CODE_RELAY_URL=https://${RELAY_DOMAIN}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install bundle dependencies
        run: vp install --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.version.outputs.version }}"

      - uses: ./.github/actions/setup-apt-mirrors

      # @t3tools/desktop#build compiles the Linux browser secret helper on a
      # Linux host, and that needs libsecret headers.
      - name: Install browser secret helper build libraries
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config

      - name: Build JS bundle
        run: vp run build:desktop

      # Two paths under apps/ so the artifact root is apps/; the packaging jobs
      # download into `apps` to restore both at their build paths.
      - name: Upload JS bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 1

  build_macos:
    name: Build downloadable macOS ARM64 app
    needs: [version, build_bundle]
    runs-on: macos-15
    timeout-minutes: 60
    environment:
      name: production
    env:
      T3CODE_CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
      T3CODE_CLERK_PASSKEY_RP_DOMAINS: ${{ vars.CLERK_PASSKEY_RP_DOMAINS }}
      T3CODE_APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      # Installed builds only accept an update signed for this bundle ID by
      # the same team, and their Electron profile is keyed by product name.
      T3CODE_DESKTOP_APP_ID: com.t3code.dev
      T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install desktop dependencies
        run: vp install --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - name: Cache resource monitor
        id: resource_monitor_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: native/resource-monitor/target/aarch64-apple-darwin/release/t3-resource-monitor
          key: resource-monitor-aarch64-apple-darwin-${{ hashFiles('native/resource-monitor/Cargo.lock', 'native/resource-monitor/Cargo.toml', 'native/resource-monitor/src/**') }}

      - name: Setup Rust
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.version.outputs.version }}"

      - name: Download JS bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: js-bundle
          path: apps

      - name: Configure required macOS signing
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_VALUE: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID_VALUE: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_VALUE: ${{ secrets.APPLE_API_ISSUER }}
          MACOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.MACOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          required=(
            T3CODE_APPLE_TEAM_ID
            T3CODE_CLERK_PASSKEY_RP_DOMAINS
            CSC_LINK
            CSC_KEY_PASSWORD
            APPLE_API_KEY_VALUE
            APPLE_API_KEY_ID_VALUE
            APPLE_API_ISSUER_VALUE
            MACOS_PROVISIONING_PROFILE_BASE64
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required Developer ID release credential: $name" >&2
              exit 1
            fi
          done

          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID_VALUE}.p8"
          printf '%s' "$APPLE_API_KEY_VALUE" > "$key_path"
          chmod 600 "$key_path"

          profile_path="$RUNNER_TEMP/t3code.provisionprofile"
          printf '%s' "$MACOS_PROVISIONING_PROFILE_BASE64" |
            /usr/bin/base64 -D > "$profile_path"
          security cms -D -i "$profile_path" >/dev/null

          {
            printf 'CSC_LINK=%s\n' "$CSC_LINK"
            printf 'CSC_KEY_PASSWORD=%s\n' "$CSC_KEY_PASSWORD"
            printf 'APPLE_API_KEY=%s\n' "$key_path"
            printf 'APPLE_API_KEY_ID=%s\n' "$APPLE_API_KEY_ID_VALUE"
            printf 'APPLE_API_ISSUER=%s\n' "$APPLE_API_ISSUER_VALUE"
            printf 'T3CODE_MACOS_PROVISIONING_PROFILE=%s\n' "$profile_path"
          } >> "$GITHUB_ENV"
          echo "Developer ID signing and notarization enabled."

      - name: Build ARM64 DMG
        shell: bash
        env:
          T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: ${{ steps.resource_monitor_cache.outputs.cache-hit == 'true' }}
        run: |
          set -euo pipefail
          vp run dist:desktop:artifact \
            --platform mac \
            --target dmg \
            --arch arm64 \
            --build-version "${{ needs.version.outputs.version }}" \
            --output-dir release-publish \
            --skip-build \
            --signed \
            --verbose

      # electron-builder notarizes the app inside; the DMG people download is
      # signed, notarized, and stapled here. Updates use the zip, so the DMG's
      # entry in latest-mac.yml is never read by an updater.
      - name: Sign, notarize, and staple DMG
        shell: bash
        run: |
          set -euo pipefail
          dmg="$(find release-publish -maxdepth 1 -name '*.dmg' -print -quit)"
          if [[ -z "$dmg" ]]; then
            echo "No DMG was produced." >&2
            exit 1
          fi
          keychain="$RUNNER_TEMP/t3code-dmg-signing.keychain-db"
          keychain_password="$(openssl rand -base64 36)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security list-keychains -d user -s \
            "$keychain" \
            "$HOME/Library/Keychains/login.keychain-db"
          p12="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$CSC_LINK" | /usr/bin/base64 -D > "$p12"
          security import "$p12" \
            -k "$keychain" \
            -P "$CSC_KEY_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain" >/dev/null
          identity="$(
            security find-identity -v -p codesigning "$keychain" |
              awk -F'"' '/Developer ID Application/ {print $2; exit}'
          )"
          if [[ -z "$identity" ]]; then
            echo "No Developer ID Application identity found in the signing keychain." >&2
            exit 1
          fi
          codesign --force --sign "$identity" --timestamp "$dmg"
          xcrun notarytool submit "$dmg" \
            --key "$APPLE_API_KEY" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          # A fresh ticket can take a while to reach the CDN stapler reads
          # (error 68), which failed fork runs right after notarization.
          for attempt in 1 2 3 4 5 6; do
            if xcrun stapler staple "$dmg"; then
              break
            fi
            if (( attempt == 6 )); then
              echo "Stapling the DMG failed after $attempt attempts." >&2
              exit 1
            fi
            sleep $((attempt * 20))
          done
          security delete-keychain "$keychain"
          security list-keychains -d user -s "$HOME/Library/Keychains/login.keychain-db"

      - name: Verify downloadable artifacts
        shell: bash
        run: |
          set -euo pipefail
          dmg="$(find release-publish -maxdepth 1 -name '*.dmg' -print -quit)"
          if [[ -z "$dmg" ]]; then
            echo "No DMG was produced." >&2
            exit 1
          fi
          if ! compgen -G 'release-publish/*-arm64.zip' >/dev/null || [[ ! -f release-publish/latest-mac.yml ]]; then
            echo "The update payload (zip) or latest-mac.yml is missing." >&2
            exit 1
          fi
          hdiutil verify "$dmg"
          mount_point="$(mktemp -d "$RUNNER_TEMP/t3code-dmg.XXXXXX")"
          cleanup() {
            hdiutil detach "$mount_point" -quiet 2>/dev/null || true
            rmdir "$mount_point" 2>/dev/null || true
          }
          trap cleanup EXIT
          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mount_point" -quiet
          app="$(find "$mount_point" -maxdepth 1 -name '*.app' -print -quit)"
          if [[ -z "$app" ]]; then
            echo "No app bundle was found in the DMG." >&2
            exit 1
          fi
          codesign --verify --deep --strict --verbose=4 "$app"
          signing_details="$(codesign --display --verbose=4 "$app" 2>&1)"
          if ! grep -Fq "TeamIdentifier=${T3CODE_APPLE_TEAM_ID}" <<<"$signing_details"; then
            echo "App is not signed by the configured Apple Developer team." >&2
            printf '%s\n' "$signing_details" >&2
            exit 1
          fi
          if ! grep -Fq "Identifier=${T3CODE_DESKTOP_APP_ID}" <<<"$signing_details"; then
            echo "App is not signed as ${T3CODE_DESKTOP_APP_ID}; installed builds would reject the update." >&2
            printf '%s\n' "$signing_details" >&2
            exit 1
          fi
          if grep -Fq "Signature=adhoc" <<<"$signing_details"; then
            echo "Refusing to publish an ad-hoc signed app." >&2
            exit 1
          fi
          spctl --assess --type execute --verbose=4 "$app"
          xcrun stapler validate "$app"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg"
          xcrun stapler validate "$dmg"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fork-macos-arm64-${{ needs.version.outputs.version }}
          path: release-publish/*
          if-no-files-found: error

  # Windows installers are unsigned: this repository has no Azure Trusted
  # Signing credentials, so users get a SmartScreen warning on first run. A
  # failed Windows leg must not block the macOS release (see publish).
  # No Linux CLI archive is built, so these installers carry no WSL runtime
  # and the WSL backend reports that the build lacks WSL support.
  build_windows:
    name: Build downloadable Windows ${{ matrix.arch }} app
    needs: [version, build_bundle]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
            rust_target: x86_64-pc-windows-msvc
            spectre_component: Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre
          - arch: arm64
            runner: windows-11-arm
            rust_target: aarch64-pc-windows-msvc
            spectre_component: Microsoft.VisualStudio.Component.VC.Runtimes.ARM64.Spectre
    env:
      # NSIS derives the install location and uninstall entry from the app ID,
      # so a different ID would install beside the existing app.
      T3CODE_DESKTOP_APP_ID: com.t3code.dev
      T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Windows installs straight from the registry; upstream measured a
      # package cache restore as slower than a plain install there.
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Install desktop dependencies
        run: vp install --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - name: Cache resource monitor
        id: resource_monitor_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: native/resource-monitor/target/${{ matrix.rust_target }}/release/t3-resource-monitor.exe
          key: resource-monitor-${{ matrix.rust_target }}-${{ hashFiles('native/resource-monitor/Cargo.lock', 'native/resource-monitor/Cargo.toml', 'native/resource-monitor/src/**') }}

      - name: Setup Rust
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust_target }}

      # Only the resource monitor build needs these libraries.
      - name: Install Spectre-mitigated MSVC libs
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          SPECTRE_COMPONENT: ${{ matrix.spectre_component }}
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -products * -latest -property installationPath
          $setupExe = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $proc = Start-Process -FilePath $setupExe `
            -ArgumentList "modify", "--installPath", "`"$installPath`"", "--add", `
            $env:SPECTRE_COMPONENT, "--quiet", "--norestart" `
            -Wait -PassThru -NoNewWindow
          if ($null -eq $proc -or $proc.ExitCode -ne 0) {
            $code = if ($null -ne $proc) { $proc.ExitCode } else { 1 }
            Write-Error "Visual Studio Installer failed with exit code $code"
            exit $code
          }

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.version.outputs.version }}"

      - name: Download JS bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: js-bundle
          path: apps

      - name: Build ${{ matrix.arch }} NSIS installer (unsigned)
        shell: bash
        env:
          T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: ${{ steps.resource_monitor_cache.outputs.cache-hit == 'true' }}
        run: |
          set -euo pipefail
          vp run dist:desktop:artifact \
            --platform win \
            --target nsis \
            --arch "${{ matrix.arch }}" \
            --build-version "${{ needs.version.outputs.version }}" \
            --output-dir release-publish \
            --skip-build \
            --verbose

      # Both arches emit the same channel manifest name ("latest.yml"), so
      # suffix them per arch and let the publish job merge the pair.
      - name: Collect installer and updater manifest
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          rm -f release-publish/builder-debug.yml release-publish/builder-effective-config.yaml
          exe=(release-publish/*.exe)
          if (( ${#exe[@]} == 0 )); then
            echo "No Windows installer was produced." >&2
            exit 1
          fi
          for manifest in release-publish/*.yml; do
            mv "$manifest" "${manifest%.yml}-win-${{ matrix.arch }}.yml"
          done
          ls -1 release-publish

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fork-windows-${{ matrix.arch }}-${{ needs.version.outputs.version }}
          path: release-publish/*
          if-no-files-found: error

  publish:
    name: Publish fork release
    needs: [version, build_macos, build_windows]
    # A failed Windows leg must not withhold a working macOS release, so gate
    # on macOS only and publish whatever Windows artifacts exist.
    if: ${{ !cancelled() && needs.build_macos.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/scripts...

      - name: Download all build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: fork-*
          merge-multiple: true
          path: release-publish

      # electron-updater reads one latest.yml and picks the file entry whose
      # name carries the running arch, so the per-arch manifests are merged.
      - name: Merge Windows updater manifests
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          rm -f release-publish/builder-debug*.yml release-publish/builder-effective-config.yaml

          for x64_manifest in release-publish/*-win-x64.yml; do
            arm64_manifest="${x64_manifest%-x64.yml}-arm64.yml"
            merged_manifest="${x64_manifest%-win-x64.yml}.yml"
            if [[ -f "$arm64_manifest" ]]; then
              node scripts/merge-update-manifests.ts --platform win \
                "$x64_manifest" "$arm64_manifest" "$merged_manifest"
              rm -f "$x64_manifest" "$arm64_manifest"
            else
              echo "No arm64 counterpart for $x64_manifest; publishing x64 alone." >&2
              mv "$x64_manifest" "$merged_manifest"
            fi
          done

          # Arm64 manifests left over had no x64 counterpart.
          for arm64_manifest in release-publish/*-win-arm64.yml; do
            echo "No x64 counterpart for $arm64_manifest; publishing arm64 alone." >&2
            mv "$arm64_manifest" "${arm64_manifest%-win-arm64.yml}.yml"
          done

          echo "Publishing these assets:"
          ls -1 release-publish

      - name: Publish fork release for in-app updates
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          TITLE: T3 Code Fork ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(release-publish/*)
          if (( ${#assets[@]} == 0 )); then
            echo "No release assets were produced." >&2
            exit 1
          fi

          publish_release() {
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release edit "$TAG" \
                --target "$GITHUB_SHA" \
                --title "$TITLE"
              gh release upload "$TAG" "${assets[@]}" --clobber
            else
              gh release create "$TAG" \
                "${assets[@]}" \
                --target "$GITHUB_SHA" \
                --title "$TITLE" \
                --generate-notes
            fi
          }

          for attempt in 1 2 3 4 5; do
            if publish_release; then
              exit 0
            fi
            if (( attempt == 5 )); then
              echo "GitHub release publishing failed after $attempt attempts." >&2
              exit 1
            fi
            delay=$((attempt * 5))
            echo "GitHub release publishing attempt $attempt failed; retrying in ${delay}s." >&2
            sleep "$delay"
          done
