name: Fork macOS ARM64 release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Optional semver (for example 0.2.0)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: fork-macos-arm64-release
  cancel-in-progress: true

jobs:
  build:
    name: Build downloadable macOS ARM64 app
    runs-on: [self-hosted, macOS, ARM64, t3code-mac]
    timeout-minutes: 60
    environment:
      name: production
    env:
      T3CODE_CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
      T3CODE_CLERK_JWT_TEMPLATE: ${{ vars.CLERK_JWT_TEMPLATE }}
      T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ vars.CLERK_CLI_OAUTH_CLIENT_ID }}
      T3CODE_RELAY_URL: https://${{ vars.RELAY_DOMAIN }}
      T3CODE_DESKTOP_APP_ID: com.t3code.dev
      T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - id: release
        name: Resolve fork release version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${REQUESTED_VERSION:-0.1.${GITHUB_RUN_NUMBER}}"
          version="${version#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=fork-v$version" >> "$GITHUB_OUTPUT"

      - name: Build ARM64 DMG
        run: |
          vp run dist:desktop:artifact \
            --platform mac \
            --target dmg \
            --arch arm64 \
            --build-version "${{ steps.release.outputs.version }}" \
            --output-dir release-publish

      - name: Verify downloadable artifacts
        shell: bash
        run: |
          set -euo pipefail
          dmg="$(find release-publish -maxdepth 1 -name '*.dmg' -print -quit)"
          if [[ -z "$dmg" ]]; then
            echo "No DMG was produced." >&2
            exit 1
          fi
          hdiutil verify "$dmg"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: t3-code-macos-arm64-${{ steps.release.outputs.version }}
          path: release-publish/*
          if-no-files-found: error

      - name: Publish fork release for in-app updates
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(release-publish/*)
          if (( ${#assets[@]} == 0 )); then
            echo "No release assets were produced." >&2
            exit 1
          fi
          gh release create "${{ steps.release.outputs.tag }}" \
            "${assets[@]}" \
            --target "$GITHUB_SHA" \
            --title "T3 Code Fork ${{ steps.release.outputs.version }}" \
            --generate-notes
