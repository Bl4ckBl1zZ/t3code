name: Fork macOS ARM64 release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Optional semver (for example 0.2.0)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: fork-macos-arm64-release
  cancel-in-progress: false

jobs:
  build:
    name: Build downloadable macOS ARM64 app
    runs-on: macos-15
    timeout-minutes: 35
    environment:
      name: production
    env:
      T3CODE_CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
      T3CODE_CLERK_JWT_TEMPLATE: ${{ vars.CLERK_JWT_TEMPLATE }}
      T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ vars.CLERK_CLI_OAUTH_CLIENT_ID }}
      T3CODE_RELAY_URL: https://${{ vars.RELAY_DOMAIN }}
      T3CODE_DESKTOP_APP_ID: com.t3code.dev
      T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
      T3CODE_APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      T3CODE_CLERK_PASSKEY_RP_DOMAINS: ${{ vars.CLERK_PASSKEY_RP_DOMAINS }}
      T3CODE_MACOS_PROVISIONING_PROFILE: ${{ runner.temp }}/t3code.provisionprofile
      CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - id: release
        name: Resolve fork release version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${REQUESTED_VERSION:-0.1.${GITHUB_RUN_NUMBER}}"
          version="${version#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=fork-v$version" >> "$GITHUB_OUTPUT"

      - name: Prepare macOS signing profile
        shell: bash
        env:
          MACOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.MACOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          required=(
            T3CODE_APPLE_TEAM_ID
            T3CODE_CLERK_PASSKEY_RP_DOMAINS
            CSC_LINK
            CSC_KEY_PASSWORD
            APPLE_API_KEY
            APPLE_API_KEY_ID
            APPLE_API_ISSUER
            MACOS_PROVISIONING_PROFILE_BASE64
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required macOS release credential: $name" >&2
              exit 1
            fi
          done
          printf '%s' "$MACOS_PROVISIONING_PROFILE_BASE64" |
            /usr/bin/base64 -D > "$T3CODE_MACOS_PROVISIONING_PROFILE"
          security cms -D -i "$T3CODE_MACOS_PROVISIONING_PROFILE" >/dev/null

      - name: Build, sign, and notarize ARM64 DMG
        run: |
          vp run dist:desktop:artifact \
            --platform mac \
            --target dmg \
            --arch arm64 \
            --build-version "${{ steps.release.outputs.version }}" \
            --output-dir release-publish \
            --signed \
            --verbose

      - name: Verify signed and notarized artifacts
        shell: bash
        run: |
          set -euo pipefail
          dmg="$(find release-publish -maxdepth 1 -name '*.dmg' -print -quit)"
          if [[ -z "$dmg" ]]; then
            echo "No DMG was produced." >&2
            exit 1
          fi
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
          xcrun stapler validate "$dmg"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: t3-code-macos-arm64-${{ steps.release.outputs.version }}
          path: release-publish/*
          if-no-files-found: error

      - name: Publish fork release for in-app updates
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(release-publish/*)
          if (( ${#assets[@]} == 0 )); then
            echo "No release assets were produced." >&2
            exit 1
          fi
          gh release create "${{ steps.release.outputs.tag }}" \
            "${assets[@]}" \
            --target "$GITHUB_SHA" \
            --title "T3 Code Fork ${{ steps.release.outputs.version }}" \
            --generate-notes
