name: Fork macOS ARM64 release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Optional semver (for example 0.2.0)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: fork-macos-arm64-release
  cancel-in-progress: true

jobs:
  build:
    name: Build downloadable macOS ARM64 app
    runs-on: [self-hosted, macOS, ARM64, t3code-mac]
    timeout-minutes: 60
    environment:
      name: production
    env:
      T3CODE_CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
      T3CODE_CLERK_JWT_TEMPLATE: ${{ vars.CLERK_JWT_TEMPLATE }}
      T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ vars.CLERK_CLI_OAUTH_CLIENT_ID }}
      T3CODE_RELAY_URL: https://${{ vars.RELAY_DOMAIN }}
      T3CODE_DESKTOP_APP_ID: com.t3code.dev
      T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
      T3CODE_APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      T3CODE_CLERK_PASSKEY_RP_DOMAINS: ${{ vars.CLERK_PASSKEY_RP_DOMAINS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: false
          run-install: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@nightly

      - id: release
        name: Resolve fork release version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${REQUESTED_VERSION:-0.1.${GITHUB_RUN_NUMBER}}"
          version="${version#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=fork-v$version" >> "$GITHUB_OUTPUT"

      - id: signing
        name: Configure macOS signing
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_VALUE: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID_VALUE: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_VALUE: ${{ secrets.APPLE_API_ISSUER }}
          MACOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.MACOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          required=(
            T3CODE_APPLE_TEAM_ID
            T3CODE_CLERK_PASSKEY_RP_DOMAINS
            CSC_LINK
            CSC_KEY_PASSWORD
            APPLE_API_KEY_VALUE
            APPLE_API_KEY_ID_VALUE
            APPLE_API_ISSUER_VALUE
            MACOS_PROVISIONING_PROFILE_BASE64
          )
          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            echo "Developer ID signing is not fully configured; building a complete ad-hoc signed app."
            printf 'Missing: %s\n' "${missing[*]}"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID_VALUE}.p8"
          printf '%s' "$APPLE_API_KEY_VALUE" > "$key_path"
          chmod 600 "$key_path"

          profile_path="$RUNNER_TEMP/t3code.provisionprofile"
          printf '%s' "$MACOS_PROVISIONING_PROFILE_BASE64" |
            /usr/bin/base64 -D > "$profile_path"
          security cms -D -i "$profile_path" >/dev/null

          {
            printf 'CSC_LINK=%s\n' "$CSC_LINK"
            printf 'CSC_KEY_PASSWORD=%s\n' "$CSC_KEY_PASSWORD"
            printf 'APPLE_API_KEY=%s\n' "$key_path"
            printf 'APPLE_API_KEY_ID=%s\n' "$APPLE_API_KEY_ID_VALUE"
            printf 'APPLE_API_ISSUER=%s\n' "$APPLE_API_ISSUER_VALUE"
            printf 'T3CODE_MACOS_PROVISIONING_PROFILE=%s\n' "$profile_path"
          } >> "$GITHUB_ENV"
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "Developer ID signing and notarization enabled."

      - name: Build ARM64 DMG
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --platform mac
            --target dmg
            --arch arm64
            --build-version "${{ steps.release.outputs.version }}"
            --output-dir release-publish
            --verbose
          )
          if [[ "${{ steps.signing.outputs.enabled }}" == "true" ]]; then
            args+=(--signed)
          fi
          vp run dist:desktop:artifact "${args[@]}"

      - name: Verify downloadable artifacts
        shell: bash
        run: |
          set -euo pipefail
          dmg="$(find release-publish -maxdepth 1 -name '*.dmg' -print -quit)"
          if [[ -z "$dmg" ]]; then
            echo "No DMG was produced." >&2
            exit 1
          fi
          hdiutil verify "$dmg"
          mount_point="$(mktemp -d "$RUNNER_TEMP/t3code-dmg.XXXXXX")"
          cleanup() {
            hdiutil detach "$mount_point" -quiet 2>/dev/null || true
            rmdir "$mount_point" 2>/dev/null || true
          }
          trap cleanup EXIT
          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mount_point" -quiet
          app="$(find "$mount_point" -maxdepth 1 -name '*.app' -print -quit)"
          if [[ -z "$app" ]]; then
            echo "No app bundle was found in the DMG." >&2
            exit 1
          fi
          codesign --verify --deep --strict --verbose=4 "$app"
          if [[ "${{ steps.signing.outputs.enabled }}" == "true" ]]; then
            spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
            xcrun stapler validate "$dmg"
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: t3-code-macos-arm64-${{ steps.release.outputs.version }}
          path: release-publish/*
          if-no-files-found: error

      - name: Publish fork release for in-app updates
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(release-publish/*)
          if (( ${#assets[@]} == 0 )); then
            echo "No release assets were produced." >&2
            exit 1
          fi

          tag="${{ steps.release.outputs.tag }}"
          title="T3 Code Fork ${{ steps.release.outputs.version }}"
          publish_release() {
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release edit "$tag" \
                --target "$GITHUB_SHA" \
                --title "$title"
              gh release upload "$tag" "${assets[@]}" --clobber
            else
              gh release create "$tag" \
                "${assets[@]}" \
                --target "$GITHUB_SHA" \
                --title "$title" \
                --generate-notes
            fi
          }

          for attempt in 1 2 3 4 5; do
            if publish_release; then
              exit 0
            fi
            if (( attempt == 5 )); then
              echo "GitHub release publishing failed after $attempt attempts." >&2
              exit 1
            fi
            delay=$((attempt * 5))
            echo "GitHub release publishing attempt $attempt failed; retrying in ${delay}s." >&2
            sleep "$delay"
          done
